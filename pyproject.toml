[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dc-gem"
version = "0.1.0"
description = "Differentiable Core with Gradient-Free Episodic Memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dc-gem = "dc_gem.cli:main"

[tool.setuptools.packages.find]
include = ["dc_gem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]